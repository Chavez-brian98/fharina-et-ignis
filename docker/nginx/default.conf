server {
    listen 80;
    listen 443 ssl;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    index index.php index.html;
    server_name localhost;
    
    # Apunta a la carpeta public de tu proyecto
    root /var/www/html/public;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Archivos y directorios reales se sirven directo; el resto va al
    # front controller reproduciendo el mapping Apache "index.php?url=$1".
    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?url=$1 last;
    }

    # WebSocket del tracking de domicilios: el navegador conecta a /ws y
    # nginx lo proxya al relay (contenedor "ws", puerto 8090). Los upgrades se
    # tragan el body enseguida, no pasan por try_files.
    location /ws {
        proxy_pass http://ws:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Apunta al servicio "app" en el puerto 9000 (PHP-FPM)
        # Si nginx muere con "host not found in upstream \"app\"", el servicio
        # app todavia no esta en la red de Docker: levantar con "docker compose up -d"
        # (no solo "docker compose up web"). Sin esta linea el .php se sirve como
        # texto plano en vez de ejecutarse.
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}