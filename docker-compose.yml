services:
  # Contenedor de PHP-FPM
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: fharina-et-ignis:1.0 
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  # Contenedor de Nginx
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      # Montamos el archivo de configuración de Nginx que creamos en el paso 2
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Contenedor de Base de Datos
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: fharina_et_ignis
      MYSQL_USER: orellana
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql